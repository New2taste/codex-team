version = "ai-workflow-1"

[policy]
max_technical_retries = 1
max_implementation_reworks = 2
max_cross_model_escalations = 1
automatic_xhigh = false
automatic_sol_high = false
automatic_merge = false
automatic_push = false

[routing]
mode = "enforced"
role_policy = "terra_os"

[final_acceptance_rework]
fixer_role = "sol_medium_reviewer"
fixer_permission_profile = "assignment-scoped-write"
fixer_distinct_from_acceptor = true
recheck_role = "sol_medium_reviewer"
recheck_distinct_from_fixer = true
terminal_escalation_role = "sol_xhigh"
terminal_review_required = false

[roles.luna]
model = "gpt-5.6-luna"
reasoning_effort = "max"
sandbox = "read-only"
allowed_statuses = ["SUPPORTED", "PARTIALLY_SUPPORTED", "NOT_SUPPORTED", "BLOCKED"]
instructions = """Handle only bounded tasks. Do not redefine scope or acceptance. Use the requested L0/L1/L2 evidence level. Never claim final acceptance."""

[roles.luna_construction]
model = "gpt-5.6-luna"
reasoning_effort = "max"
sandbox = "workspace-write"
allowed_statuses = ["IMPLEMENTED_CANDIDATE", "NEEDS_CLARIFICATION", "BLOCKED"]
instructions = """Own only a locally verified bounded construction envelope with exact allowed paths, deterministic done_when, L0/L1/L2 evidence, negative or mutation checks, and runnable commands. Do not plan, review, widen scope, handle security work, merge, push, or self-approve."""

[roles.terra]
model = "gpt-5.6-terra"
reasoning_effort = "xhigh"
sandbox = "workspace-write"
allowed_statuses = ["IMPLEMENTED_CANDIDATE", "NEEDS_CLARIFICATION", "BLOCKED"]
instructions = """Own implementation only inside the authorized worktree and paths. Stop on semantic ambiguity. Never merge, push, or self-approve."""

[roles.sol_planner]
model = "gpt-5.6-sol"
reasoning_effort = "medium"
sandbox = "read-only"
allowed_statuses = ["PLAN_READY", "NEEDS_OWNER_DECISION", "INSUFFICIENT_EVIDENCE"]
instructions = """Convert evidence into a bounded plan with frozen invariants and decidable acceptance criteria. Do not implement."""

[roles.sol_reviewer]
model = "gpt-5.6-sol"
reasoning_effort = "medium"
sandbox = "read-only"
allowed_statuses = ["ACCEPTANCE_RECOMMENDED", "ACCEPTANCE_WITH_NOTES_RECOMMENDED", "REWORK_RECOMMENDED", "REJECT_RECOMMENDED", "ESCALATION_PROPOSED"]
instructions = """Review the pinned candidate against the task contract and evidence. Recommend a verdict but never enact owner decisions."""

[roles.sol_xhigh]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
sandbox = "read-only"
requires_owner_approval = true
allowed_statuses = ["OPTION_A", "OPTION_B", "OPTION_C", "INSUFFICIENT_EVIDENCE"]
instructions = """Decide only the closed-set dispute in the authorized case file. Do not implement or invent an unlisted option."""

[roles.terra_xhigh]
model = "gpt-5.6-terra"
reasoning_effort = "xhigh"
sandbox = "workspace-write"
allowed_statuses = ["IMPLEMENTED_CANDIDATE", "NEEDS_CLARIFICATION", "BLOCKED"]
instructions = """Own complex construction, decomposition, integration, and open-ended debugging only inside the authorized worktree and paths. Stop on semantic ambiguity. Never merge, push, or self-approve."""

[roles.terra_xhigh_planner]
model = "gpt-5.6-terra"
reasoning_effort = "xhigh"
sandbox = "read-only"
allowed_statuses = ["PLAN_READY", "NEEDS_OWNER_DECISION", "INSUFFICIENT_EVIDENCE"]
instructions = """Produce only the bounded plan selected by a persisted terra_os read-only route. Do not implement, modify repository files, merge, push, or self-approve."""

[roles.terra_xhigh_reviewer]
model = "gpt-5.6-terra"
reasoning_effort = "xhigh"
sandbox = "read-only"
allowed_statuses = ["ACCEPTANCE_RECOMMENDED", "ACCEPTANCE_WITH_NOTES_RECOMMENDED", "REWORK_RECOMMENDED", "REJECT_RECOMMENDED", "ESCALATION_PROPOSED"]
instructions = """Review only the pinned acceptance candidate selected by a persisted terra_os read-only route. Recommend a verdict without modifying files or enacting owner decisions."""

[roles.sol_medium_supervisor]
model = "gpt-5.6-sol"
reasoning_effort = "medium"
sandbox = "read-only"
allowed_statuses = ["PLAN_READY", "NEEDS_OWNER_DECISION", "INSUFFICIENT_EVIDENCE"]
instructions = """Reserved for legacy compatibility only. Do not select this role for ordinary terra_os task planning, construction, or local acceptance."""

[roles.sol_medium_reviewer]
model = "gpt-5.6-sol"
reasoning_effort = "medium"
sandbox = "read-only"
allowed_statuses = ["ACCEPTANCE_RECOMMENDED", "ACCEPTANCE_WITH_NOTES_RECOMMENDED", "REWORK_RECOMMENDED", "REJECT_RECOMMENDED", "ESCALATION_PROPOSED"]
instructions = """Reserved for the scoped fallback repair and peer-review ladder. Do not select this role for ordinary terra_os task planning, construction, or local acceptance."""

[roles.sol_xhigh_planner]
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
sandbox = "read-only"
requires_owner_approval = true
allowed_statuses = ["OPTION_A", "OPTION_B", "OPTION_C", "INSUFFICIENT_EVIDENCE"]
instructions = """Plan only an owner-authorized large project in its closed case file. Do not implement, review local task acceptance, or invent an unlisted option."""
